name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Flutter project
        run: flutter create --platforms=android --project-name ar_forge app

      - name: Add packages
        working-directory: app
        run: |
          flutter pub add image_picker video_player ffmpeg_kit_flutter_new gal
          flutter pub add dev:flutter_launcher_icons

      - name: Set minSdk 24
        run: |
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' app/android/app/build.gradle.kts || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' app/android/app/build.gradle || true

      - name: Add logo
        run: |
          mkdir -p app/assets
          cp "AR FORGE LOGO.PNG" app/assets/logo.png
          sed -i 's/^flutter:$/flutter:\n  assets:\n    - assets\/logo.png/' app/pubspec.yaml
          printf 'flutter_launcher_icons:\n  android: true\n  ios: false\n  image_path: "assets/logo.png"\n' > app/flutter_launcher_icons.yaml

      - name: Make app icon
        working-directory: app
        run: dart run flutter_launcher_icons -f flutter_launcher_icons.yaml

      - name: Use our main.dart
        run: cp main.dart app/lib/main.dart

      - name: Build APK
        working-directory: app
        run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: AR-Forge-APK
          path: app/build/app/outputs/flutter-apk/*-release.apk
